
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Disc shape with transparent center hole -->
    <path id="disc" fill-rule="evenodd"
          d="M256 16 A240 240 0 1 0 256 496 A240 240 0 1 0 256 16 Z
             M256 220 A36 36 0 1 1 256 292 A36 36 0 1 1 256 220 Z"/>
    <clipPath id="discClip"><use href="#disc"/></clipPath>
 
    <!-- Reflective sheen gradients -->
    <radialGradient id="sheenWhite" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0.15" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="sheenMint" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0.15" stop-color="#4DD4AC" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#4DD4AC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4DD4AC" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
 
  <!-- Disc body #14171D -->
  <use href="#disc" fill="#14171D"/>
 
  <!-- Light sheen and grooves, clipped to the disc -->
  <g clip-path="url(#discClip)">
    <path d="M256 256 L376 48.2 A240 240 0 0 1 463.8 136 Z" fill="url(#sheenWhite)"/>
    <path d="M256 256 L136 463.8 A240 240 0 0 1 48.2 376 Z" fill="url(#sheenWhite)"/>
    <path d="M256 256 L24.2 318.2 A240 240 0 0 1 16.9 276.9 Z" fill="url(#sheenMint)"/>
    <path d="M256 256 L487.8 193.9 A240 240 0 0 1 495.1 235.1 Z" fill="url(#sheenMint)"/>
 
    <g fill="none" stroke="#4DD4AC">
      <!-- Fine grooves -->
      <circle cx="256" cy="256" r="205" stroke-width="1" opacity="0.18"/>
      <circle cx="256" cy="256" r="198" stroke-width="1" opacity="0.12"/>
      <circle cx="256" cy="256" r="150" stroke-width="1" opacity="0.10"/>
      <circle cx="256" cy="256" r="143" stroke-width="1" opacity="0.08"/>
      <!-- Tick marks around the rim -->
      <circle cx="256" cy="256" r="220" stroke-width="5" stroke-dasharray="1.5 10.5" opacity="0.45"/>
      <!-- Thin accent ring inside the outer strip -->
      <circle cx="256" cy="256" r="229" stroke-width="1.5" opacity="0.40"/>
    </g>
 
    <!-- Hub area: slightly lighter clear-plastic ring -->
    <path fill="#FFFFFF" fill-opacity="0.05" fill-rule="evenodd"
          d="M256 198 A58 58 0 1 0 256 314 A58 58 0 1 0 256 198 Z
             M256 220 A36 36 0 1 1 256 292 A36 36 0 1 1 256 220 Z"/>
  </g>
 
  <!-- Hub rings -->
  <circle cx="256" cy="256" r="58" fill="none" stroke="#4DD4AC" stroke-width="1.5" opacity="0.55"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="#4DD4AC" stroke-width="2"
          stroke-dasharray="3 7" opacity="0.5"/>
 
  <!-- Outer diameter strip (#4DD4AC) -->
  <circle cx="256" cy="256" r="237" fill="none" stroke="#4DD4AC" stroke-width="6"/>
  <!-- Inner hole edge (#4DD4AC) -->
  <circle cx="256" cy="256" r="36" fill="none" stroke="#4DD4AC" stroke-width="6"/>
 
  <!-- "Mint" on the left of the hole, "Play" on the right -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800"
     font-size="50" letter-spacing="1">
    <text x="180" y="273" text-anchor="end" fill="#FFFFFF">Mint</text>
    <text x="332" y="273" text-anchor="start" fill="#4DD4AC">Play</text>
  </g>
</svg>
